name: CRM scheduled jobs

# Vercel Hobby allows only 2 cron jobs and only once per day, so vercel.json
# keeps task-generator and overdue-marker and everything else runs from here.
# GitHub Actions schedules are free but best-effort: a run can be delayed by
# several minutes under load, and scheduled workflows are disabled after 60
# days with no repository activity.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   CRM_BASE_URL  e.g. https://your-app.vercel.app   (no trailing slash)
#   CRON_SECRET   the same value set in the Vercel environment
#
# Delete this file once you move to Vercel Pro and put every path back into
# vercel.json.

on:
  schedule:
    - cron: "*/15 * * * *"   # frequent  - order sync, workflow engine
    - cron: "20 * * * *"     # hourly    - masked-number healing, shipping sync
    - cron: "0 */6 * * *"    # 6-hourly  - transit monitoring
    - cron: "15 0 * * *"     # daily     - housekeeping and reminders
  workflow_dispatch:
    inputs:
      group:
        description: "Which group to run"
        required: true
        default: frequent
        type: choice
        options: [frequent, hourly, sixhourly, daily]

concurrency:
  group: crm-cron-${{ github.event.schedule || inputs.group }}
  cancel-in-progress: false

# The job only makes outbound HTTP calls; it never touches the repository.
permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve job list
        id: plan
        env:
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL: ${{ inputs.group }}
        run: |
          case "${SCHEDULE:-}" in
            "*/15 * * * *") group=frequent ;;
            "20 * * * *")   group=hourly ;;
            "0 */6 * * *")  group=sixhourly ;;
            "15 0 * * *")   group=daily ;;
            *)              group="${MANUAL:-frequent}" ;;
          esac

          # /api/sync/all is deliberately absent. It chains six jobs in one
          # request (Shopify, Shiprocket, webhook backlog, task generation,
          # self-healing, reminders) and always exceeds the function limit.
          # Five of the six are already scheduled individually below, so only
          # the Shopify half needed a home.
          case "$group" in
            frequent)  paths="/api/cron/workflow-executor /api/sync/shopify /api/cron/campaign-sender" ;;
            hourly)    paths="/api/cron/unmask-sentinel /api/cron/shiprocket-sync /api/cron/reconcile-ghost-transit" ;;
            sixhourly) paths="/api/cron/transit-inform /api/cron/transit-escalator" ;;
            # analytics-digest?range=weekly self-gates to Mondays inside the
            # route, so it can ride the same daily trigger without a fifth
            # cron schedule.
            # refresh-product-catalog self-gates to the 1st/11th/21st inside
            # the route, so it rides the daily trigger for a ~3x/month cadence.
            # issue-task-generator and winback-generator were split out of
            # task-generator (see that route's own comment) - task-generator
            # itself stays on Vercel's native cron (vercel.json, both of its
            # 2 Hobby-plan slots already taken), but these two new phases
            # need a home and ride the daily GitHub Actions trigger instead.
            daily)     paths="/api/cron/unresponsive-handler /api/cron/segment-updater /api/cron/recovery-reminder /api/cron/reorder-reminder /api/cron/review-reminder /api/cron/daily-digest /api/cron/analytics-digest?range=daily /api/cron/analytics-digest?range=weekly /api/cron/refresh-product-catalog /api/cron/sla-escalator /api/cron/issue-task-generator /api/cron/winback-generator /api/backup /api/cron/prune-webhook-logs" ;;
          esac

          echo "group=$group" >> "$GITHUB_OUTPUT"
          echo "paths=$paths" >> "$GITHUB_OUTPUT"
          echo "Running group: $group"

      - name: Trigger endpoints
        env:
          BASE_URL: ${{ secrets.CRM_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PATHS: ${{ steps.plan.outputs.paths }}
        run: |
          # Until the secrets are added this workflow has nothing to call.
          # Skip quietly rather than failing: a scheduled job that fails every
          # 15 minutes just mails the repo owner into ignoring it.
          if [ -z "$BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::Skipped - set the CRM_BASE_URL and CRON_SECRET repository secrets to enable scheduled jobs."
            exit 0
          fi

          failed=0
          for path in $PATHS; do
            echo "--> POST $path"

            # No --retry: these endpoints do real work, so retrying a slow one
            # starts a second sync on top of the first. 90s is just past the
            # Vercel Hobby 60s function ceiling, so a cut-off shows as a 504
            # rather than costing us three 5-minute waits.
            code=$(curl -sS -o /tmp/body.txt -w '%{http_code} %{time_total}s' \
              --max-time 90 \
              -X POST "${BASE_URL}${path}" \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "x-cron-secret: ${CRON_SECRET}" || echo "000 timeout")

            echo "    result: $code"
            echo "    body:   $(head -c 400 /tmp/body.txt)"

            # A sync being cut off at the plan's function limit is expected on
            # Hobby and the work resumes next tick, so it must not turn the
            # job red forever - permanent red is the same as no alerting.
            # Anything else, including a timeout on a job that should be fast,
            # still fails.
            case "$path" in
              /api/sync/*) tolerate_timeout=yes ;;
              *)           tolerate_timeout=no ;;
            esac

            case "$code" in
              2*)        echo "    ok" ;;
              401*|403*) echo "::error::${path} - CRON_SECRET does not match the value in Vercel"; failed=1 ;;
              404*)      echo "::error::${path} - 404. Check CRM_BASE_URL and that the route is deployed"; failed=1 ;;
              504*|000*)
                if [ "$tolerate_timeout" = yes ]; then
                  echo "::warning::${path} - cut off at the Vercel function limit. Partial progress kept; the next run continues. Upgrade to Pro, or batch the sync, to finish in one pass."
                else
                  echo "::error::${path} - timed out, and this job is not expected to be slow"
                  failed=1
                fi
                ;;
              5*)        echo "::error::${path} - server error, see body above"; failed=1 ;;
              *)         echo "::warning::${path} returned $code"; failed=1 ;;
            esac
          done
          exit $failed
